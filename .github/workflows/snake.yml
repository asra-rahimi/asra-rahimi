
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%238FC5E5&color_dots=%23F0E2D5,%23C49A78,%23A77B5B,%2376513B,%234B3025
            dist/github-snake-dark.svg?color_snake=%238FC5E5&color_dots=%23F0E2D5,%23C49A78,%23A77B5B,%2376513B,%234B3025
            dist/github-snake.gif?color_snake=%238FC5E5&color_dots=%23F0E2D5,%23C49A78,%23A77B5B,%2376513B,%234B3025&color_background=%23182B3A

      - name: Deploy Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
